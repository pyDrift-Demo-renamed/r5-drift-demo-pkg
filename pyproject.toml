[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r5-drift-demo-pkg"
version = "0.1.0"
description = "Research demo for a controlled PyPI metadata-drift self-experiment (TestPyPI only; not for real use)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "pyDrift-Demo"}]

[project.urls]
Homepage = "https://github.com/pyDrift-Demo/r5-drift-demo-pkg"
Repository = "https://github.com/pyDrift-Demo/r5-drift-demo-pkg"

[tool.setuptools]
packages = ["r5_drift_demo_pkg"]
